name: Build AbzzModz

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build AbzzModz
        run: msbuild AbzzModz.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AbzzModz
          path: |
            x64/Release/AbzzModz.dll
